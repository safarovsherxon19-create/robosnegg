name: Daily Robo Snake uploads

on:
  schedule:
    - cron: "0 0 * * *" # every day 00:00 UTC (05:00 Tashkent)
  workflow_dispatch:

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        video: [short-1, cube-plinko, short-2, cube-laser, short-3, cube-maze]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright requests && python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/daily_upload.py
        env:
          SITE_URL: https://robosnegg.lovable.app
          VIDEO: ${{ matrix.video }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
